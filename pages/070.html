    <h1 class="p070__title t-opening">Paraná fósil<br>Santa Fe</h1>
    <p class="p070__text t-darwin body">1 de octubre.—Hemos partido a la luz de la Luna y llegado al río Tercero con la salida del Sol. Dicho río lleva también el nombre de Saladillo, por lo salobre de sus aguas. Me detuve aquí la mayor parte del día para buscar huesos fósiles.</p>
